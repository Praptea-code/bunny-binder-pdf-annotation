<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bunny Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- LIBRARY -->
<div id="libView">
  <div class="gingham"></div><div class="lace"></div>
  <header class="hero">
    <div class="hero-title">
      <svg class="bun-title" viewBox="0 0 48 48" role="img" aria-label="Bunny" focusable="false">
        <path d="M15 21C12 14 11 6 15 5c4-1 7 6 8 12M33 21c3-7 4-15 0-16-4-1-7 6-8 12" fill="#fff" stroke="#5b3047" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16.4 17.2c-1.3-4.2-1.6-8.4-.4-8.8 1.7-.5 3.9 4.4 4.7 8.3M31.6 17.2c1.3-4.2 1.6-8.4.4-8.8-1.7-.5-3.9 4.4-4.7 8.3" fill="#f6a9c8"/>
        <ellipse cx="24" cy="28" rx="13" ry="11.5" fill="#fff" stroke="#5b3047" stroke-width="2.2"/>
        <circle cx="19" cy="27" r="1.6" fill="#5b3047"/><circle cx="29" cy="27" r="1.6" fill="#5b3047"/>
        <path d="M22.4 31.2c.9.9 2.3.9 3.2 0" fill="none" stroke="#5b3047" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M24 29.5v1.2" stroke="#5b3047" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="15.5" cy="30.5" r="2" fill="#fbc9dc"/><circle cx="32.5" cy="30.5" r="2" fill="#fbc9dc"/>
      </svg>
      <h1>Bunny Binder</h1>
    </div>
    <p>Every PDF tucked in one cozy spot</p>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="Search PDFs…" aria-label="Search PDFs">
    <button id="favBtn" class="chip">★ Favorites</button>
    <select id="sort" aria-label="Sort"><option value="recent">Recently opened</option><option value="name">Name</option><option value="added">Date added</option></select>
    <label class="btn" for="file">+ Add PDFs</label><input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
  </div>
  <div id="tags" class="tagrow"></div>
  <main id="grid" class="grid"></main>
  <p id="empty" class="empty" hidden>No PDFs yet.<br>Drop files anywhere on this page or press “Add PDFs”.</p>
  <div class="lace flip"></div><div class="gingham"></div>
</div>

<!-- READER -->
<div id="readView" hidden>
  <div class="gingham thin"></div>
  <div class="tb">
    <button id="back" class="btn">‹ Library</button>
    <strong id="title"></strong>
    <div class="grp" id="tools">
      <button data-t="select" title="Select (V)" aria-label="Select">👆</button>
      <button data-t="hl" title="Highlight text (H)" aria-label="Highlight">🖍️</button>
      <button data-t="note" title="Sticky note (N)" aria-label="Sticky note">📝</button>
      <button data-t="text" title="Type text (T)" aria-label="Text">Aa</button>
      <button data-t="pen" title="Draw (P)" aria-label="Pen">✏️</button>
      <button data-t="erase" title="Eraser (E)" aria-label="Eraser">🧽</button>
    </div>
    <div class="grp" id="sw" aria-label="Colors"></div>
    <div class="grp">
      <button id="zout" aria-label="Zoom out">−</button><span id="zl">100%</span><button id="zin" aria-label="Zoom in">+</button>
    </div>
    <button id="pg" class="pgb" title="Go to page">1 / 1</button>
    <button id="sideBtn" class="btn" title="Notes & comments">💬 Notes</button>
  </div>
  <div class="body">
    <div id="stage"></div>
    <aside id="side"></aside>
  </div>
</div>

<div id="pop" hidden>
  <p id="pq"></p>
  <textarea id="pt" rows="3" placeholder="Add a comment…" aria-label="Comment"></textarea>
  <div class="grp" id="pc"></div>
  <div class="acts"><button id="pd" class="ghost">Delete</button><button id="px" class="ghost">Done</button></div>
</div>
<dialog id="dlg">
  <form method="dialog">
    <p id="dlgMsg"></p>
    <input id="dlgIn" type="text" aria-label="Value">
    <div class="acts"><button value="cancel" class="ghost">Cancel</button><button value="ok" class="btn">OK</button></div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="lib/pdf.min.js"></script>
<script src="js/app.js"></script>
</body>
